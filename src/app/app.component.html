<ion-app>
  <!-- Menu Lateral do Visitante -->
  <ion-menu contentId="main-content" type="overlay" class="custom-side-menu">
    <ion-content class="menu-content">
      <div class="menu-container">
        <div class="menu-header">
          <div class="logo-container">
            <img src="/assets/image/logo.png" alt="Logo desplugAI" class="menu-logo" />
          </div>
          <ion-menu-toggle>
            <button class="btn-close" type="button">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </ion-menu-toggle>
        </div>

        <div class="menu-list">
          <ion-menu-toggle auto-hide="false">
            <div class="menu-card" routerLink="/visitante" routerDirection="root">
              <div class="card-left">
                <div class="icon-wrapper">
                  <ion-icon name="home-outline"></ion-icon>
                </div>
                <span>Home</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
            </div>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <div class="menu-card mb-extended">
              <div class="card-left">
                <div class="icon-wrapper">
                  <ion-icon name="search-outline"></ion-icon>
                </div>
                <span>Pesquisa de Planos</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
            </div>
          </ion-menu-toggle>

          <ion-item-divider class="menu-divider"></ion-item-divider>

          <!-- BOTÃO ENTRAR CORRIGIDO COM ROTA /login -->
          <ion-menu-toggle auto-hide="false">
            <div class="menu-card card-highlight" routerLink="/login" routerDirection="forward">
              <div class="card-left">
                <div class="icon-wrapper">
                  <ion-icon name="log-in-outline"></ion-icon>
                </div>
                <span>Entrar</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
            </div>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <div class="menu-card card-outline" routerLink="/cadastro" routerDirection="forward">
              <div class="card-left">
                <div class="icon-wrapper">
                  <ion-icon name="person-add-outline"></ion-icon>
                </div>
                <span>Criar Conta</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
            </div>
          </ion-menu-toggle>
        </div>

        <div class="menu-footer">
          <p class="text-white opacity-70">© 2026 DesplugAI. Todos os direitos reservados.</p>
        </div>
      </div>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
