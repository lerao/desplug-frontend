<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons class="button-back" slot="start">
      <ion-button fill="clear" [routerLink]="routerLink">
        <ion-icon slot="start" [name]="iconName"></ion-icon>
        {{ backButtonText }}
      </ion-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>
